# Given-name pool for the binding experiments.
#
# NOT the shared `core/schemas/_shared/names.yaml`. That pool contains names that are also common
# nouns or schema-adjacent words -- Sage / Rosa / Basil in a restaurant, Skyler / Phoenix / River /
# Ocean / Lake at an airport, plus Wren, Robin, Iris, Parker, Rowan, Sakura. With headcounts up to
# 14 and per-family uniqueness, drawing one of those stops being unlikely, and a name that reads as
# scenery corrupts exactly the headcount measure 1A exists to take.
#
# Every name here is vetted against, and enforced by `tests/test_binding_pools.py`:
#   - no collision with either schema's forbidden_labels / role forbidden / role accept words
#   - not a common English noun, occupation, plant, place, or nature word (HAZARD list in the test)
#   - a single token (no space, hyphen or apostrophe), so anchor matching stays unambiguous
#   - unique across all three gender buckets
#
# Role-bearers are ALWAYS named, never described ("a person with a backpack" is a materially harder
# referent to bind than "Maya", and that difficulty is uncontrolled). Gender tags exist only to keep
# co-present people pronoun-distinguishable.

