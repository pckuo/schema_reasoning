# Named, narratively-licensed distractor people for experiment 1A.
#
# NOT the shared `core/schemas/_shared/distractors.yaml`. That pool is unnamed inert scenery
# ("a man talking loudly on his phone"), roughly half of it not even people ("rain started, then
# stopped"), and the generator is told they "take no part in the story and never interact". 1A
# needs the opposite: people who are genuinely IN the story, tracked by name, and demonstrably
# holding no queried role.
#
# The spec's failure mode: "an unexplained extra person in a restaurant reads as a customer, and
# the model will assign them a role -- silently changing B." Every entry therefore carries
#   licence : the explicit non-role reason to be present
#   beat    : a concrete action, so they are a participant rather than background
#   scene   : where they may be inserted, so insertion never disturbs scene order
#
# Wording constraint: no entry may contain a forbidden noun of its schema (restaurant bans
# food/meal/dish/table/menu/bill/check/cook/host/server/guest/customer/diner...; airport bans
# flight/seat/gate/ticket/passenger/officer/guard/attendant/pilot...). Enforced by
# tests/test_binding_pools.py against the real forbidden_set of both naming modes.

restaurant:
  outside_inventory:
    - key: courier
      licence: "is dropping off a parcel addressed to the owner and leaves straight away"
      beat: "carried in a parcel, set it down by the door, took a signature, and went back out"
      scene: arrive
    - key: musician
      licence: "is setting up to play in the corner much later that night and deals with no one"
      beat: "knelt by an amplifier in the corner, coiling cable and plucking one string over and over"
      scene: seated
    - key: electrician
      licence: "is there to repair a flickering light fitting and speaks to nobody"
      beat: "worked a screwdriver into the fitting overhead, then climbed down and packed a toolbox"
      scene: order
    - key: florist
      licence: "is delivering cut stems for the window display and leaves at once"
      beat: "brought in a dripping bucket of cut stems, ranged them along the sill, and left"
      scene: arrive
    - key: window_cleaner
      licence: "is working on the outside of the glass, sealed off from everyone within"
      beat: "drew a squeegee down the outside of the window in long slow strokes"
      scene: eat
    - key: piano_tuner
      licence: "is tuning the upright in the corner and never turns around"
      beat: "struck the same note again and again, tightening a peg between each try"
      scene: seated
    - key: postal_worker
      licence: "is delivering the day's post and moves straight on"
      beat: "pushed a thick bundle of envelopes through the slot by the door and moved on"
      scene: arrive
    - key: painter
      licence: "is touching up a doorframe and keeps out of everyone's way"
      beat: "ran a loaded brush along the doorframe, then stepped back to squint at the line"
      scene: order
    - key: knife_sharpener
      licence: "is collecting blades to grind and returns them without going further in"
      beat: "gathered a canvas roll of blades from the back door and carried it out to a van"
      scene: pay
    - key: sign_writer
      licence: "is repainting the lettering on the front window from outside"
      beat: "traced gold lettering backwards across the outside of the front window"
      scene: leave
    - key: busker
      licence: "is playing on the pavement outside and never comes in"
      beat: "worked through the same three chords on the pavement outside, case open"
      scene: leave
    - key: meter_reader
      licence: "is taking a reading from the cupboard by the stairs and leaves"
      beat: "crouched at the cupboard by the stairs, wrote a number on a pad, and slipped out"
      scene: eat
  inside_unqueried:
    # An extra visitor: INSIDE the role inventory but never queried. Built and logged, but not
    # generated by default -- the identify judge's rubric (subjects/judge.py:180-188) scores a
    # distractor "wrong" as soon as the response gives them any step in the sequence of events,
    # which is exactly what an extra visitor has. See the plan, section 4.2.
    - key: solo_visitor
      licence: "is there for their own evening and never once crosses paths with the others"
      beat: "sat alone near the back with a paperback and never looked up"
      scene: seated
    - key: pair_visitor
      licence: "is out with a friend that night and stays entirely to themselves"
      beat: "leaned across a corner nook talking quietly with a friend the whole while"
      scene: order

airport:
  outside_inventory:
    - key: cleaner
      licence: "is mopping the concourse floor and deals with nobody"
      beat: "worked a mop in slow arcs across the tiles, nudging a yellow cone ahead"
      scene: arrive
    - key: shuttle_driver
      licence: "is waiting to drive an empty crew van back and speaks to no one here"
      beat: "leaned on a pillar by the kerb, van keys turning over in one hand"
      scene: arrive
    - key: announcer
      licence: "reads notices from the booth upstairs and never comes onto the floor"
      beat: "stepped out of the upstairs booth to swap a dead microphone, then shut the door again"
      scene: walk_gate
    - key: newsstand_vendor
      licence: "is restocking the shelves of the kiosk and never leaves it"
      beat: "cut open a bundle of magazines and squared them onto the kiosk shelves"
      scene: walk_gate
    - key: electrician
      licence: "is replacing a failed light panel overhead and speaks to nobody"
      beat: "stood on a short ladder easing a long light panel out of the ceiling"
      scene: check_in
    - key: window_cleaner
      licence: "is working the outside of the tall glass, sealed off from everyone inside"
      beat: "swung slowly down the outside of the tall glass on a cradle, squeegee working"
      scene: security
    - key: courier
      licence: "is delivering a document pouch to an upstairs office and leaves at once"
      beat: "jogged a sealed document pouch up the escalator and came straight back down"
      scene: check_in
    - key: busker
      licence: "is playing outside the doors and never comes through them"
      beat: "played a slow tune on a battered accordion just beyond the doors"
      scene: arrive
    - key: carousel_engineer
      licence: "is servicing the belt machinery and takes no part in anything else"
      beat: "knelt at the end of the belt with a panel open, testing the rollers by hand"
      scene: baggage
    - key: florist
      licence: "is restocking the flower stall by the doors and leaves"
      beat: "wheeled a trolley of wrapped stems to the stall by the doors and stacked them"
      scene: deplane
    - key: painter
      licence: "is repainting a bollard by the kerb and keeps well clear"
      beat: "rolled fresh yellow onto a bollard by the kerb, taping the edge first"
      scene: arrive
    - key: sniffer_handler
      licence: "is walking a dog along the empty far wall on a training round and stops for no one"
      beat: "walked a working dog slowly along the empty far wall and back again"
      scene: walk_gate
  inside_unqueried:
    - key: solo_own_trip
      licence: "is making their own trip that day and never once crosses paths with the others"
      beat: "queued at a different counter across the hall, then walked off toward the far end"
      scene: check_in
    - key: pair_own_trip
      licence: "is setting out with a friend that day and keeps entirely to themselves"
      beat: "sat with a friend a long way down the row of chairs, bags between their feet"
      scene: walk_gate
